[package]
name = "dot-over"
edition = "2024"
version = "0.0.1"
description = "A git-based files overlay manager (dotfiles as overlays)"
readme = "README.md"
repository = "https://github.com/noirbizarre/over/"
license = "MIT"

[[bin]]
name = "over"
path = "src/main.rs"

[[bin]]
name = "git-over"
path = "src/bin/git-over.rs"

[dependencies]
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
dirs = "6.0"
glob = "0.3"
globset = "0.4"
symlink = "0.1"
minijinja = "2.18"
walkdir = "2"
tokio = { version = "1.50", features = ["rt", "rt-multi-thread", "macros", "fs", "process", "sync"] }
indicatif = "0.18"
toml = { version = "1.0", features = ["parse", "display"] }
git2 = "0.20"
git2_credentials = "0.15"
async-trait = "0.1"
console = "0.16"
anyhow = "1.0"
futures = "0.3"
serde_yml = "0.0.12"
which = "8.0"
libz-sys = { version = "1.1", optional = true }

[dependencies.clap]
features = ["derive", "env", "unicode", "cargo", "color"]
version = "4.6"

[dependencies.config]
default-features = false
features = ["yaml", "toml"]
version = "0.15"

[dependencies.serde]
features = ["derive"]
version = "1.0"

[dev-dependencies]
pretty_assertions = { version = "1.4", features = ["unstable"] }
assert_cmd = { version = "2.2", features = ["color", "color-auto"] }
assert_fs = { version = "1.1", features = ["color", "color-auto"] }
predicates = { version = "3.1", features = ["color"] }
rstest = "0.26"
tempfile = "3.27"

[features]
vendored = ["git2/vendored-libgit2", "git2/vendored-openssl", "libz-sys/static"]
