# over — A git-based file overlay manager (dotfiles as overlays)
#
# Two binaries, one crate: `over` is the standalone CLI, `git-over` is a git
# subcommand (resolved by Git through an executable named exactly `git-over`
# on PATH). Both share the library's domain types (`Overlay`, `Repository`)
# and `utils::resolve_home`. See docs/adr/001-two-binaries-one-crate.md.

[package]
name = "dot-over"
edition = "2024"
version = "0.0.1"
# The MSRV. Checked by a dedicated CI job, which greps this very line — keep it
# a plain literal. `rust-toolchain.toml` separately pins the channel to develop
# against; the two answer different questions.
rust-version = "1.98"
license = "MIT"
authors = ["Axel H. <noirbizarre@gmail.com>"]
description = "A git-based file overlay manager (dotfiles as overlays)"
repository = "https://github.com/noirbizarre/over"
homepage = "https://noirbizarre.github.io/over/"
documentation = "https://noirbizarre.github.io/over/"
readme = "README.md"
keywords = ["dotfiles", "overlay", "git", "symlink", "cli"]
categories = ["command-line-utilities", "filesystem", "development-tools"]

[[bin]]
name = "over"
path = "src/main.rs"

[[bin]]
name = "git-over"
path = "src/bin/git-over.rs"

# No explicit [lib] table: Cargo infers the library target's name from the
# package name (`dot_over`), which is what `use dot_over::...` in both binaries
# already expects (src/main.rs, src/bin/git-over.rs). An explicit `name = "over"`
# here would rename the lib crate and break both of them.

[profile.release]
# Release binaries are cross-compiled once per tag and downloaded many times, so
# the build cost is paid once and the size saving is paid forward.
lto = true
codegen-units = 1
strip = true

# --- project-specific --------------------------------------------------------
#
# Everything above this line is owned by the template and will keep updating.
# Everything below is yours.
#
# The template seeds these two sections once, at `git tpl init`, and then leaves
# them alone: Dependabot bumps versions here weekly, and a template that
# propagated its own would open a conflict against every one of those PRs.
# Resolve in favour of the project if `git tpl update` ever touches them.

[dependencies]
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
dirs = "6.0"
etcetera = "0.11"
gethostname = "1.1"
glob = "0.3"
globset = "0.4"
symlink = "0.1"
minijinja = "2.20"
walkdir = "2"
termtree = "1.0"
tokio = { version = "1.52", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "fs",
  "process",
  "sync",
] }
indicatif = "0.18"
toml = { version = "1.0", features = ["parse", "display"] }
git2 = { version = "0.21", features = ["ssh", "https"] }
git2_credentials = "0.16"
async-trait = "0.1"
console = "0.16"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
futures = "0.3"
noyalib = { version = "0.0.30", features = ["compat-serde-yaml"] }
which = "8.0"
libz-sys = { version = "1.1", optional = true }
similar = "3.2"

[dependencies.clap]
features = ["derive", "env", "unicode", "cargo", "color"]
version = "4.6"

[dependencies.clap_complete]
version = "4.6"

[dependencies.config]
default-features = false
features = ["yaml", "toml"]
version = "0.15"

[dependencies.serde]
features = ["derive"]
version = "1.0"

[dev-dependencies]
pretty_assertions = { version = "1.4", features = ["unstable"] }
assert_cmd = { version = "2.2", features = ["color", "color-auto"] }
assert_fs = { version = "1.1", features = ["color", "color-auto"] }
predicates = { version = "3.1", features = ["color"] }
rstest = "0.26"
tempfile = "3.27"

[features]
vendored = ["git2/vendored-libgit2", "git2/vendored-openssl", "libz-sys/static"]
