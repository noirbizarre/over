# over — A git-based file overlay manager (dotfiles as overlays)
#
# One binary: `over`. Git repository overlays are a nested subcommand group
# (`over git mount`/`add`/`status`, see src/cli/git/mod.rs) rather than a
# second `[[bin]]` resolved through Git's own `git-<verb>` PATH mechanism.
# See docs/adr/023-merge-git-over-into-over.md (supersedes ADR-001).

[package]
name = "over"
edition = "2024"
version = "0.1.0"
# The MSRV. Checked by a dedicated CI job, which greps this very line — keep it
# a plain literal. `rust-toolchain.toml` separately pins the channel to develop
# against; the two answer different questions.
rust-version = "1.98"
license = "MIT"
# No `authors`: Cargo/crates.io stopped generating and reading it after the
# 2021 edition — ownership on crates.io comes from the registry account that
# published, not this field. `author` still feeds LICENSE and, when `aur` is
# on, the PKGBUILD's `# Maintainer:` line.
description = "A git-based file overlay manager (dotfiles as overlays)"
repository = "https://github.com/noirbizarre/over"
homepage = "https://noirbizarre.github.io/over/"
documentation = "https://noirbizarre.github.io/over/"
readme = "README.md"
keywords = ["dotfiles", "overlay", "git", "symlink", "cli"]
categories = ["command-line-utilities", "filesystem", "development-tools"]
# Not published to crates.io. Distribution is through the release assets alone,
# and `cargo install over` would create a second install path that
# nothing tests and nobody updates.
publish = false

# cargo-binstall otherwise derives an asset name from the target triple, and
# the publish workflow's assets carry short platform suffixes instead (the
# `asset` field of each entry in `data/targets.toml`). A wrong guess is not an
# error: binstall silently falls back to compiling from source, which is the
# slow path this exists to avoid. So every target the publish workflow builds
# is mapped by hand, from that same catalogue — one override per selected
# target, so this list never drifts from the publish matrix.
#
# `pkg-fmt = "tgz"`, not the template default of `"bin"`: unlike the
# template's bare-binary default, this project's "Stage the asset" step in
# publish-release.yaml always archives (`.tar.gz`/`.zip`), because
# Homebrew/AUR (packaging/) and the docs already expect that shape. The
# Windows leg overrides `pkg-fmt` to `"zip"` to match.
[package.metadata.binstall]
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/{ version }/over_{ version }_linux-amd64.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/{ version }/over_{ version }_linux-arm64.tar.gz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/{ version }/over_{ version }_linux-amd64-musl.tar.gz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/{ version }/over_{ version }_darwin-amd64.tar.gz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/{ version }/over_{ version }_darwin-arm64.tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
pkg-url = "{ repo }/releases/download/{ version }/over_{ version }_windows-amd64.zip"

[[bin]]
name = "over"
path = "src/main.rs"

[lib]
name = "over"
path = "src/lib.rs"

[profile.release]
# Release binaries are cross-compiled once per tag and downloaded many times, so
# the build cost is paid once and the size saving is paid forward.
#
# Cargo only reads [profile.*] from a workspace's root manifest, so this stays
# unconditional: member crates inherit it whether or not this file also
# defines a [package].
lto = true
codegen-units = 1
strip = true

# --- project-specific --------------------------------------------------------
#
# Everything above this line is owned by the template and will keep updating.
# Everything below is yours.
#
# The template seeds what follows once, at `git tpl init`, and then leaves it
# alone: Dependabot bumps versions here weekly, and a template that propagated
# its own would open a conflict against every one of those PRs. Resolve in
# favour of the project if `git tpl update` ever touches it.

[dependencies]
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
dirs = "7.0"
etcetera = "0.11"
gethostname = "1.1"
glob = "0.3"
globset = "0.4"
symlink = "0.1"
minijinja = "2.20"
walkdir = "2"
termtree = "1.0"
tokio = { version = "1.52", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "fs",
  "process",
  "sync",
] }
indicatif = "0.18"
toml = { version = "1.0", features = ["parse", "display"] }
git2 = { version = "0.21", features = ["ssh", "https"] }
git2_credentials = "0.16"
async-trait = "0.1"
console = "0.16"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
futures = "0.3"
noyalib = { version = "0.0.44", features = ["compat-serde-yaml"] }
which = "8.0"
libz-sys = { version = "1.1", optional = true }
similar = "3.2"

[dependencies.clap]
features = ["derive", "env", "unicode", "cargo", "color"]
version = "4.6"

[dependencies.clap_complete]
version = "4.6"

[dependencies.config]
default-features = false
features = ["yaml", "toml"]
version = "0.15"

[dependencies.serde]
features = ["derive"]
version = "1.0"

[dev-dependencies]
pretty_assertions = { version = "1.4", features = ["unstable"] }
assert_cmd = { version = "2.2", features = ["color", "color-auto"] }
assert_fs = { version = "1.1", features = ["color", "color-auto"] }
predicates = { version = "3.1", features = ["color"] }
rstest = "0.27"
tempfile = "3.27"

[features]
vendored = ["git2/vendored-libgit2", "git2/vendored-openssl", "libz-sys/static"]
