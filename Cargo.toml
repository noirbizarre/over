[package]
name = "dot-over"
edition = "2024"
version = "0.0.1"
description = "A git-based files overlay manager (dotfiles as overlays)"
readme = "README.md"
repository = "https://github.com/noirbizarre/over/"
license = "MIT"

[[bin]]
name = "over"
path = "src/main.rs"

[[bin]]
name = "git-over"
path = "src/bin/git-over.rs"

[dependencies]
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
directories = "6.0"
dirs = "6.0"
glob = "0.3"
globset = "0.4"
normpath = "1.5"
symlink = "0.1"
minijinja = "2.18"
walkdir = "2"
tokio = { version = "1.50", features = ["full"] }
indicatif = "0.18"
toml = { version = "1.0", features = ["parse", "display"] }
git2 = "0.20"
git2_credentials = "0.15"
async-trait = "0.1"
console = "0.16"
anyhow = "1.0"
thiserror = "2.0"
futures = "0.3"
once_cell = "1.21"
serde_yaml = "0.9"
which = "8.0"

[dependencies.clap]
features = ["derive", "env", "unicode", "cargo", "color"]
version = "4.6"

[dependencies.config]
features = ["yaml", "toml"]
version = "0.15"

[dependencies.serde]
features = ["derive"]
version = "1.0"

[dev-dependencies]
mockall = "0.13"
mockall_double = "0.3"
pretty_assertions = { version = "1.4", features = ["unstable"] }
assert_cmd = { version = "2.2", features = ["color", "color-auto"] }
assert_fs = { version = "1.1", features = ["color", "color-auto"] }
dir-diff = "0.3"
predicates = { version = "3.1", features = ["color"] }
rstest = "0.25"
trycmd = "1.1"
tempfile = "3.27"

[features]
