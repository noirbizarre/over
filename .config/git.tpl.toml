# git-tpl — https://noirbizarre.github.io/git-tpl/configuration/
#
# This file is versioned with the project. Edit an answer and run
# `git tpl update` to re-render the template with it.

[template]
source = "https://github.com/noirbizarre/rust.tpl"

[answers]
author = "Axel H. <noirbizarre@gmail.com>"
bin_name = "over"
categories = "command-line-utilities, filesystem, development-tools"
copyright_holder = "Axel H."
copyright_year = 2026
crate = "over"
description = "A git-based file overlay manager (dotfiles as overlays)"
docs = true
docs_accent = "indigo"
keywords = "dotfiles, overlay, git, symlink, cli"
msrv = true
msrv_version = "1.98"
owner = "noirbizarre"
publish = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
