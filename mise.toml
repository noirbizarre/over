# Toolchain and task definitions.
#
# Tool versions are resolved to exact builds in `mise.lock`, which is committed.
# CI installs from these two files, so local runs and CI runs use identical tool versions.
#
# Tools no CI job needs are declared on their own task rather than in `[tools]`,
# because `mise install` — what CI runs — installs `[tools]` only.
# It matters as cargo-binstall has no prebuilt artifact for some cargo tools,
# so a global entry would make every CI job compile them from source.
[settings]
# Resolve tools through mise.lock and keep it updated.
lockfile = true

# Do not let mise adopt `rust-toolchain.toml`.
# Rust is installed by rustup locally and by `dtolnay/rust-toolchain` in CI,
# which handle per-job components and cross-compilation targets that mise does not.
# Leaving both in charge would have mise shadow the toolchain CI just installed.
idiomatic_version_file_enable_tools = []

[tools]
actionlint = "latest"
# actionlint silently skips its shellcheck integration when the binary is absent
shellcheck = "latest"
prek = "latest"
typos = "latest"
git-cliff = "latest"
cargo-binstall = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-llvm-cov" = "latest"
"cargo:git-tpl" = "latest"
# Zensical runs through `uv tool run`, so uv is the only thing the docs build
# needs. Not the `uvx` shorthand: whether the aqua-installed `uv` package also
# gets a `uvx` shim depends on registry metadata mise doesn't control, and a
# stale `mise-action` cache can carry that gap forward silently. `uv tool run`
# only ever needs the `uv` binary mise itself resolves and always shims.
uv = "latest"

# --- begin project-specific tools ---
# Add project-wide tools here; tools needed by only one task belong on that task.
devcontainer-cli = "latest"
# --- end project-specific tools ---

[hooks]
postinstall = [
  "prek install",
]

# --- Everyday ---------------------------------------------------------------
[tasks.default]
description = "Run format, lint, build and test"
depends = ["format", "lint", "lint:actions", "lint:md", "build", "test"]

[tasks.build]
description = "Build the project"
sources = [
  "Cargo.toml",
  "Cargo.lock",
  "rust-toolchain.toml",
  "mise.lock",
  ".cargo/config",
  ".cargo/config.toml",
  "build.rs",
  "src/**",
]
outputs = [
  'target/debug/over{% if os() == "windows" %}.exe{% endif %}',
  "target/debug/libover.rlib",
]
# Keep freshness checks and Docker's default input aligned even with CARGO_TARGET_DIR set.
run = "cargo build --target-dir target"

[tasks.test]
description = "Run tests (accepts nextest selectors)"
raw_args = true
run = "cargo nextest run"

[tasks.cover]
description = "Run tests with coverage"
run = "cargo llvm-cov nextest"

[tasks.format]
description = "Format the code"
run = "cargo fmt --all"

[tasks."format:check"]
description = "Check the formatting without rewriting"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "Lint the code"
# `-Dclippy::all` rather than the template's `-D warnings`: this predates the
# template attachment and AGENTS.md documents it as the convention. Keep this
# task aligned with that guidance; Clippy runs explicitly and in CI, not hooks.
run = "cargo clippy --all-targets --all-features -- -Dclippy::all"

[tasks.spell]
description = "Check spelling"
run = "typos"

[tasks."lint:actions"]
description = "Lint the GitHub Actions workflows"
# Suppressions live in .github/actionlint.yml rather than as flags here,
# so this task and the prek hook cannot drift apart.
run = "actionlint .github/workflows/*.yaml"

[tasks."lint:md"]
description = "Lint all project Markdown"
# Install the native binary only for this task; keep its version aligned with
# the rumdl pre-commit hook in prek.toml.
tools = { rumdl = "0.3.2" }
# The shared rumdl config excludes the generated root CHANGELOG.md.
run = "rumdl check ."

[tasks.snapshots]
description = "Review and update insta snapshots interactively"
# cargo-insta is declared here as only used once by this task
tools = { "cargo:cargo-insta" = "latest" }
run = "cargo insta review"

[tasks.check]
description = "Run every check that does not modify the working tree"
depends = ["format:check", "lint", "lint:actions", "lint:md", "spell", "test"]

[tasks.ci]
description = "Everything CI runs, locally"
depends = ["check", "docs:build"]

# --- over itself --------------------------------------------------------

[tasks.cli]
description = "Run over from source"
raw_args = true
run = "cargo run --bin over --"

[tasks.setup]
description = "Install over locally, into ~/.cargo/bin"
run = "cargo install --path . --force"

# --- Documentation ----------------------------------------------------------

[tasks.docs]
description = "Serve the documentation locally"
depends = ["schemas:generate"]
run = "uv tool run zensical serve"

[tasks."docs:build"]
description = "Build the documentation"
depends = ["schemas:generate"]
run = "uv tool run zensical build"

# --- Release ----------------------------------------------------------------

[tasks.changelog]
description = "Preview the changelog for the unreleased commits"
run = "git cliff --unreleased"

[tasks.release]
description = "Show the version the next release would take"
# The release itself is driven by gh-ship from .github/workflows/ship.yaml.
# This task exists to answer 'what would ship next?' without opening CI.
run = "git cliff --bumped-version"

[tasks."ship:validate"]
description = "Check the release setup against what gh-ship requires"
run = "gh ship validate"

# --- Template ---------------------------------------------------------------
#
# This project is rendered from https://github.com/noirbizarre/rust.tpl
# To update it:
#
#   mise tpl:check       # has it moved?
#   mise tpl:update      # bring the rendered ref up to date
#   mise tpl:diff        # read what merging it would change
#   mise tpl:merge       # take it

[tasks."tpl:update"]
description = "Advance refs/tpl/<id>; may save migrated answers without merging rendered files"
raw_args = true
run = "git tpl update"

[tasks."tpl:diff"]
description = "Show what merging the template would change"
raw_args = true
run = "git tpl diff"

[tasks."tpl:merge"]
description = "Merge the last updated rendered files"
raw_args = true
run = "git tpl merge"

[tasks."tpl:check"]
description = "Has the template moved? Exits 1 if merging it would change anything"
run = [
  "git tpl update",
  "git tpl diff --exit-code --stat",
]

# --- project-specific tasks --------------------------------------------------
#
# Add your own tasks below this line and global tools between the tools markers.
# Group related project tasks here; the template owns the sections above.
# Git's 3-way merge preserves project additions across template merges.
#
# Open any multi-line `run` block with `#!/usr/bin/env bash`. Without one mise
# runs it through `sh`, which is dash on a GitHub runner — `set -o pipefail`
# errors there and `< <(...)` is a syntax error — while `/bin/sh` is often bash
# locally. The difference does not show up until CI.
#
# Artwork tasks belong here rather than in `default` or `check`: they rewrite
# committed binaries, so a routine run would dirty the working tree every time.

[tasks."docker:build"]
description = "Build the native binary and package the runtime image"
depends = ["build"]
run = "docker build --tag over:local ."

[tasks."test:features"]
description = "Test the staged bundled Feature (requires both binaries and Docker)"
run = [
  "python3 -m unittest discover -s tests/features -p 'test_*.py'",
  "python3 tests/features/run.py",
]

[tasks."schemas:generate"]
description = "Regenerate the published configuration schemas"
run = "cargo run --locked --features schema --example generate_schemas"

[tasks."schemas:validate"]
description = "Validate generated configuration schemas and descriptor shapes"
run = [
  "cargo test --locked --features schema --lib overlays::json_schema::tests",
  "cargo test --locked --features schema --example generate_schemas",
]

[tasks.demo]
description = "Regenerate the README demo GIF"
depends = ["build"]
# vhs pinned below its latest (0.12.x): 0.12.0's evaluator cancels the
# context it later hands to its own ffmpeg invocation (Render runs after
# teardown() has already called cancel() on that same ctx), so
# `exec.CommandContext` refuses to even start ffmpeg — silently, since the
# error path only logs ffmpeg's (empty, because it never ran) output rather
# than the real error. Confirmed against both the v0.12.0 tag and `main` as
# of 2026-09; 0.11.0 predates the regression. Revisit once upstream fixes it.
# ffmpeg and gifsicle are NOT mise-managed here (neither is in mise's
# Install both via your system package manager.
# (gifsicle reduce gif size by ~2)
tools = { vhs = "0.11.0", "aqua:tsl0922/ttyd" = "latest" }
run = """
#!/usr/bin/env bash
set -euo pipefail
vhs docs/vhs/demo.tape
gifsicle -O3 --lossy=150 --colors 48 docs/images/demo.gif -o docs/images/demo.gif
"""
