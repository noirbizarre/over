name: 📚 Documentation

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - src/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - mise.toml
      - mise.lock
      - zensical.toml
      - .github/workflows/docs.yaml
  # Same paths as the push trigger: this is a check that the docs still
  # build, not a deploy. Rust inputs affect the schemas published with the site.
  pull_request:
    paths:
      - docs/**
      - src/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - mise.toml
      - mise.lock
      - zensical.toml
      - .github/workflows/docs.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 📝 Build documentation
    runs-on: ubuntu-latest
    # Redundant pushes to the same PR/branch should cancel their predecessor's
    # build — only deployment needs the strict serialization of the `pages`
    # group below.
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      # Schemas must reflect the Rust definitions in the same revision as the site.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # uv is pinned by mise.lock, so the docs build uses the same version
      # as `mise run docs:build` locally.
      - uses: jdx/mise-action@v5
        with:
          cache: true

      - name: Validate configuration schemas
        run: mise run schemas:validate

      - name: Generate schemas and build the site
        run: mise run docs:build

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    name: 🌐 Publish documentation
    needs: build
    # Never deploy from a pull_request event — including from forks, which
    # get no `pages`/`id-token` write access from GitHub regardless of what's
    # declared above. `workflow_dispatch` keeps deploying, as today.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Only one deployment at a time; never cancel one midway.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
