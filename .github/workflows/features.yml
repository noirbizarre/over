name: 📦 Devcontainer Features

on:
  push:
    branches: [main]
    # gh-ship release tags are unprefixed, matching the Docker workflow.
    tags: ["*"]
  pull_request:

jobs:
  publish:
    name: 🚀 Publish Features
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish features
        uses: devcontainers/action@v1
        with:
          base-path-to-features: features
          # Collection metadata uses <namespace>:latest; keep it away from the binary image.
          features-namespace: ${{ github.repository }}/features
          publish-features: true
          devcontainer-cli-version: "0.88.0"
          # gh-ship owns repository tags; Feature tags would retrigger release workflows.
          disable-repo-tagging: true
          # Preserve the hand-maintained lifecycle and migration documentation.
          generate-docs: false

  test:
    name: 🧪 Test Features (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Dev Container CLI
        uses: jdx/mise-action@v5
        with:
          # prek is needed by the repository's mise postinstall hook.
          install_args: devcontainer-cli prek

      - name: Validate feature metadata
        run: |
          for feature_dir in features/*/; do
            feature_name="$(basename "${feature_dir}")"
            echo "Validating feature: ${feature_name}"

            # Check required files exist
            if [ ! -f "${feature_dir}/devcontainer-feature.json" ]; then
              echo "ERROR: Missing devcontainer-feature.json in ${feature_dir}"
              exit 1
            fi
            if [ ! -f "${feature_dir}/install.sh" ]; then
              echo "ERROR: Missing install.sh in ${feature_dir}"
              exit 1
            fi

            # Validate JSON
            python3 -m json.tool "${feature_dir}/devcontainer-feature.json" > /dev/null

            # Check install.sh is executable
            if [ ! -x "${feature_dir}/install.sh" ]; then
              echo "ERROR: install.sh is not executable in ${feature_dir}"
              exit 1
            fi

            echo "  OK"
          done

      - name: Exercise installation and lifecycle
        run: python3 tests/features/run.py
