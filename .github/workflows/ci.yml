name: 👮 CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  test:
    name: 🧪 Tests (${{ matrix.os.name }})
    runs-on: ${{ matrix.os.runner }}
    strategy:
      matrix:
        os:
          - name: Linux
            runner: ubuntu-latest
            flag: linux
          - name: Windows
            runner: windows-latest
            flag: windows
          - name: macOS
            runner: macos-latest
            flag: macos
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest

      - name: Run tests (with coverage)
        shell: bash
        run: |
          cargo llvm-cov nextest --profile ci
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage data to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          # Flagging each leg keeps the three reports distinguishable, so a
          # partial upload is visible rather than looking like a coverage drop.
          flags: ${{ matrix.os.flag }}

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          directory: target/nextest/ci
          report_type: test_results
