<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Over logo</title>
  <desc id="desc">Three layered iridescent purple and blue tiles with a terminal prompt, followed by the word over and a terminal underscore.</desc>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D946EF"/>
      <stop offset=".48" stop-color="#762BFA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="middle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A855F7" stop-opacity=".82"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity=".76"/>
    </linearGradient>
    <linearGradient id="bottom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".58"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0ABFC"/>
      <stop offset=".5" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="cursor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0647D9"/>
      <stop offset="1" stop-color="#0755E8"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Stacked translucent layers -->
  <g transform="translate(63.2 18)"><g transform="scale(.96 1)">
    <path d="M35 215 190 126Q205 117 220 126L375 215Q390 224 375 233L220 322Q205 331 190 322L35 233Q20 224 35 215Z" fill="url(#bottom)"/>
    <path d="M35 160 190 71Q205 62 220 71L375 160Q390 169 375 178L220 267Q205 276 190 267L35 178Q20 169 35 160Z" fill="url(#middle)" stroke="#6550E8" stroke-opacity=".65" stroke-width="2"/>
    <path d="M35 105 190 16Q205 7 220 16L375 105Q390 114 375 123L220 212Q205 221 190 212L35 123Q20 114 35 105Z" fill="url(#top)" stroke="url(#edge)" stroke-width="5" filter="url(#softGlow)"/>
    <path d="M133 80 183 109 133 138" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M205 139H258" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round"/>
  </g></g>

  <!-- Blue wordmark, without an outline -->
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="800" letter-spacing="-9">
    <text x="475" y="257" font-size="205" fill="url(#wordmark)" stroke="none">over</text>
    <rect x="900" y="231" width="112" height="26" rx="8" fill="#A855F7"/>
  </g>
</svg>
