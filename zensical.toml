# Zensical configuration.
# https://zensical.org/docs/setup/

[project]

site_name = "over"
site_description = "A git-based file overlay manager (dotfiles as overlays)"
site_url = "https://noirbizarre.github.io/over/"
site_author = "noirbizarre"

repo_url = "https://github.com/noirbizarre/over"
repo_name = "noirbizarre/over"
edit_uri = "edit/main/docs/"

copyright = """
Copyright &copy; 2026 Axel H. — MIT licensed
"""

# Seeded, not owned: the navigation is the one part of this file that is
# entirely about your project. Extend it freely — the template will not
# meaningfully conflict with additions here.
nav = [
  { "Home" = "index.md" },
  { "Usage" = [
    { "Overview" = "usage/index.md" },
    { "over add" = "usage/add.md" },
    { "over new" = "usage/new.md" },
    { "over list" = "usage/list.md" },
    { "over show" = "usage/show.md" },
    { "over apply" = "usage/apply.md" },
    { "over lint" = "usage/lint.md" },
    { "over doctor" = "usage/doctor.md" },
    { "over completion" = "usage/completion.md" },
    { "over status" = "usage/status.md" },
    { "over diff" = "usage/diff.md" },
    { "over sync" = "usage/sync.md" },
    { "over unapply" = "usage/unapply.md" },
    { "over commit" = "usage/commit.md" },
    { "over log" = "usage/log.md" },
    { "over git mount" = "usage/over-git-mount.md" },
    { "over git add" = "usage/over-git-add.md" },
    { "over git status" = "usage/over-git-status.md" },
  ] },
  { "Configuration" = "configuration.md" },
  { "Install Configuration" = "install-config.md" },
  { "About" = [
    { "Architecture Decisions" = "adr/README.md" },
  ] },
]

[project.theme]

language = "en"

# The header slot is one line tall and already sits next to the site name, so
# it gets the mark alone — a wordmark would render as an illegible sliver and
# repeat the name. `logo.svg` is the project's existing icon mark (also used
# standalone in the README); `logo-text.svg` is the wordmark variant.
logo = "images/logo.svg"
favicon = "images/logo.svg"

features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

# Three entries, in this order. The first has no `scheme`, so it follows the
# operating system — and being first, it is what a visitor gets by default. The
# other two let anyone override that choice, which then persists.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "black"
accent = "indigo"
toggle.icon = "lucide/monitor"
toggle.name = "Following your system — switch to light"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to following your system"

# Markdown extensions used by the documentation. Admonitions and tabs carry
# most of the guidance; superfences is required for fenced code blocks with
# annotations.
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
